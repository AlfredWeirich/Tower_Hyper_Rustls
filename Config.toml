###############################################################################
# GLOBAL SYSTEM SETTINGS
# These settings affect the overall performance and base identity of the gateway.
###############################################################################

# The number of worker threads for the Tokio async runtime.
# Default: (Available CPU Cores * 2). 
# Manual override is useful for high-performance tuning on dedicated hardware.
# tokio_threads = 50

# Enable or disable background OpenTelemetry Tracing (Jaeger)
# If false, TraceLayer is silently skipped and no background export tasks are started.
enable_opentelemetry = true
jaeger_endpoint = "http://localhost:4317"
otel_log_level = "info"
# The Base Object Identifier (OID) used for security validation.
# This acts as the root for interpreting client certificate extensions and JWT claims.
# Private Enterprise Number (PEN)
pki_base_oid = "1.3.6.1.4.1.65111"


# Directory path for persistent log files.
# If commented out or omitted, the application will only log to Standard Output (stdout).
# log_dir = "log"

###############################################################################
# SERVER INSTANCE DEFINITIONS
# You can define multiple [[Server]] blocks to run several listeners simultaneously.
###############################################################################

[[Server]]
# =============================================================================
# First Server
# =============================================================================

    # --- Network Configuration ---
    # A unique name used for identifying this instance in logs and metrics.
    name = "first_server" 
    
    # The network interface IP to bind to. 
    # Use "0.0.0.0" to listen on all interfaces, or a specific local IP.
    ip = "0.0.0.0"
    
    # The TCP port the server will listen on.
    port = 1336

    # Master switch for this server instance.
    enabled = true

    # --- Protocol & Security ---
    # 'http' or 'https'. If 'https' is used, [Server.server_certs] must be configured.
    protocol = "https"

    # Authentication method required for this server:
    # "None"       - No auth (Public)
    # "ClientCert" - Mutual TLS (mTLS). Requires [[Server.client_certs]]
    # "JWT"        - JSON Web Token. Requires [Server.Layers.JWT]
    authentication = "ClientCert"

    # The service type that handles the request after passing through layers:
    # "Echo"   - Returns the request data as-is (Debug/Health checks)
    # "Router" - Forwards requests to upstreams defined in [Server.ReverseRoutes]
    service = "Router"

    # --- Middleware Layers ---
    # Defines the execution pipeline. Layers are executed in the order listed.
    [Server.Layers]
    # Options: "Timing", "Counter", "Logger", "Inspection", "JwtAuth", 
    #          "ConcurrencyLimit", "RateLimiter:Simple", "RateLimiter:TokenBucket"
    # Option 2 (Maximum Throughput - no limits):
    # enabled = ["Logger"] 
    enabled = ["Decompression", "MaxPayload", "Logger", "Inspection", "RateLimiter:TokenBucket", "ConcurrencyLimit"]

    # --- Decompression Bomb Protection ---
    [Server.Layers.Decompression]
    max_decompressed_bytes = 10485760  # 10 MB limit

    # --- TLS: Server Identity (For HTTPS) ---
    [Server.server_certs]
    # Path to the public certificate (or full chain) in PEM format.
    ssl_certificate = "/Users/fredi/Data/Projekte/Rust/ios_test/260501_ChatApp/rust_core/certs/fullchain12.pem"
    # Path to the unencrypted private key file in PEM format.
    ssl_certificate_key = "/Users/fredi/Data/Projekte/Rust/ios_test/260501_ChatApp/rust_core/certs/privkey12.pem"

    # --- TLS: Client Verification (For mTLS) ---
    # This is an array of tables. You can trust multiple Certificate Authorities.
    [[Server.client_certs]]
    # Path to the CA certificate used to verify client certificates.
    ssl_client_ca = "/Users/fredi/Data/Projekte/Rust/ios_test/260501_ChatApp/rust_core/certs/ca.pem"
    # Optional: Path to a Certificate Revocation List (CRL).
    ssl_client_crl = "/Users/fredi/Data/Projekte/Rust/ios_test/260501_ChatApp/rust_core/certs/ca.crl.pem"

    # --- Client Certificate Forwarding ---
    [Server.client_cert_forwarding]
    header_cert = "x-client-cert"
    header_san = "x-client-san"

    # --- JWT Configuration ---
    # Required only if authentication = "JWT" or "JwtAuth" is in layers.
    [Server.Layers.JWT]
    # LIST OF PATHS to public keys (PEM) used to verify JWT signatures.
    jwt_public_keys = ["./jwt/public_key.pem"]

    # --- Concurrency Management ---
    [Server.Layers.ConcurrencyLimit]
    # Maximum number of requests processed simultaneously by this server.
    max_concurrent_requests = 10000

    [Server.Layers.MaxPayload]
    max_bytes = 10485760 # 10 MB Limit

    # #########################################################################
    # --- Inspection Layer (Whitelist Regex) ---
    # Only requests matching these regex patterns will be passed to the service.
    # Format: "PathPrefix" = ["Regex1", "Regex2"]
    #[Server.AllowedPathes.GET]
    #"/"     = ["^/?$", "^/\\?name=.*$"] # Allows root and root with name query
    #"/help" = ["^/help$"]
    #"/name" = ["^/name\\??id=\\d+$"]      # Allows /name only with numeric ID

    [Server.AllowedPathes.POST]
    "/chat.ChatService/GetConversations" = ["^/chat\\.ChatService/GetConversations$"]
    "/chat.ChatService/GetMessages" = ["^/chat\\.ChatService/GetMessages$"]
    "/chat.ChatService/SendMessage" = ["^/chat\\.ChatService/SendMessage$"]
    "/chat.ChatService/StreamMessages" = ["^/chat\\.ChatService/StreamMessages$"]
    "/chat.ChatService/RegisterKeyPackage" = ["^/chat\\.ChatService/RegisterKeyPackage$"]
    "/chat.ChatService/ClientLog" = ["^/chat\\.ChatService/ClientLog$"]
    "/chat.ChatService/GetDevices" = ["^/chat\\.ChatService/GetDevices$"]
    "/chat.ChatService/BlockDevice" = ["^/chat\\.ChatService/BlockDevice$"]
    "/chat.ChatService/AddMember" = ["^/chat\\.ChatService/AddMember$"]
    "/chat.ChatService/RemoveMember" = ["^/chat\\.ChatService/RemoveMember$"]
    "/chat.ChatService/GetConversationMembers" = ["^/chat\\.ChatService/GetConversationMembers$"]
    "/chat.ChatService/CreateConversation" = ["^/chat\\.ChatService/CreateConversation$"]
    "/chat.ChatService/SearchUsers" = ["^/chat\\.ChatService/SearchUsers$"]
    "/chat.ChatService/DeleteConversation" = ["^/chat\\.ChatService/DeleteConversation$"]
    "/chat.ChatService/MarkAsRead" = ["^/chat\\.ChatService/MarkAsRead$"]
    "/chat.ChatService/StreamGlobalEvents" = ["^/chat\\.ChatService/StreamGlobalEvents$"]
    "/chat.ChatService/RegisterPushToken" = ["^/chat\\.ChatService/RegisterPushToken$"]
    "/chat.ChatService/SendGlobalEvent" = ["^/chat\\.ChatService/SendGlobalEvent$"]
    "/chat.ChatService/GetRoomProducts" = ["^/chat\\.ChatService/GetRoomProducts$"]
    "/chat.ChatService/DeleteRoomProduct" = ["^/chat\\.ChatService/DeleteRoomProduct$"]
    "/chat.ChatService/GetCart" = ["^/chat\\.ChatService/GetCart$"]
    "/chat.ChatService/AddToCart" = ["^/chat\\.ChatService/AddToCart$"]
    "/chat.ChatService/RemoveFromCart" = ["^/chat\\.ChatService/RemoveFromCart$"]
    "/chat.ChatService/PlaceOrder" = ["^/chat\\.ChatService/PlaceOrder$"]
    "/chat.ChatService/GetMyOrders" = ["^/chat\\.ChatService/GetMyOrders$"]
    "/chat.ChatService/SubscribeOrderUpdates" = ["^/chat\\.ChatService/SubscribeOrderUpdates$"]
    "/chat.ChatService/CreateRoomProduct" = ["^/chat\\.ChatService/CreateRoomProduct$"]
    "/chat.ChatService/CheckoutCart" = ["^/chat\\.ChatService/CheckoutCart$"]
    "/chat.ChatService/UpdateRoomProduct" = ["^/chat\\.ChatService/UpdateRoomProduct$"]
    "/chat.ChatService/UpdateMemberRole" = ["^/chat\\.ChatService/UpdateMemberRole$"]
    "/chat.ChatService/GetOrders" = ["^/chat\\.ChatService/GetOrders$"]
    "/chat.ChatService/UpdateOrderStatus" = ["^/chat\\.ChatService/UpdateOrderStatus$"]



    #[Server.AllowedPathes.PUT]
    #"/" = ["^/?$", "^/\\?id=\\d+$"]
    # #########################################################################

    # #########################################################################
    # --- Reverse Proxy Routing ---
    # Only active if service = "Router".

    # Syntax: [Server.ReverseRoutes."/prefix"] 
    # Longest prefix matches first (e.g., "/help" is checked before "/").
    #
    # strategy:
    #   "RoundRobin" (Default): Iterates through the upstreams one by one in order using a fast, thread-safe atomic counter.
    #   "LeastConnections": Tracks the number of active, in-flight requests for every upstream and always routes new traffic to the server currently handling the fewest connections.
    #   "Random": Uses a fast pseudo-random number generator to spray traffic randomly across all available upstreams.
    #   "Sticky": Hashes the incoming client's IP address (SocketAddr) to predictably route the exact same clients to the exact same backend servers every time (Session Affinity).

    [Server.ReverseRoutes."/"]
    upstreams = ["https://127.0.0.1:50051"]
    active_health_check_interval = 60
    backend_type = "grpc_passthrough"

    # --- Upstream Connection Parameters ---
    [Server.RouterParams]
    protocol = "https"
    authentication = "ClientCert"
    # The proxy will use this cert to authenticate against the backend's mTLS requirement.
    ssl_client_certificate = "/Users/fredi/Data/Projekte/Rust/ios_test/260501_ChatApp/rust_core/certs/proxy-client.pem"
    ssl_client_key = "/Users/fredi/Data/Projekte/Rust/ios_test/260501_ChatApp/rust_core/certs/proxy-client.key"
    # The proxy will use this CA to verify the backend's identity.
    ssl_root_certificate = "/Users/fredi/Data/Projekte/Rust/ios_test/260501_ChatApp/rust_core/certs/ca.pem"
    # #########################################################################


    # --- Rate Limiting: Simple ---
    [Server.Layers.RateLimiter]
    # Strict maximum requests per second allowed for this server.
    requests_per_second = 500000

    # --- Rate Limiting: Token Bucket ---
    [Server.Layers.TokenBucketRateLimiter]
    max_capacity = 1000     # Maximum burst size (tokens)
    refill = 50           # Number of tokens added per interval
    duration_micros = 10000 # Refill interval in microseconds

    # --- Artificial Latency ---
    [Server.Layers.Delay]
    # Delays every request by this amount. Useful for debugging or throttling.
    delay_micros = 1000000


[[Server]]
# =============================================================================
# Onboarding Server (Public - no mTLS)
# =============================================================================
            name = "onboarding_server"
            ip = "0.0.0.0"
            port = 1337
            protocol = "https"
            service = "Router"
            enabled = true
            authentication = "None"

            [Server.server_certs]
            ssl_certificate = "/Users/fredi/Data/Projekte/Rust/ios_test/260501_ChatApp/rust_core/certs/fullchain12.pem"
            ssl_certificate_key = "/Users/fredi/Data/Projekte/Rust/ios_test/260501_ChatApp/rust_core/certs/privkey12.pem"

            [Server.Layers]
            enabled = ["MaxPayload", "Logger", "Inspection", "RateLimiter:TokenBucket", "ConcurrencyLimit"]

            [Server.Layers.ConcurrencyLimit]
            max_concurrent_requests = 128

            [Server.Layers.MaxPayload]
            max_bytes = 2000000 # 2 MB Limit (CSR requests are small)

            [Server.Layers.TokenBucketRateLimiter]
            max_capacity = 15     # Maximum burst size (tokens)
            refill = 5           # Number of tokens added per interval
            duration_micros = 1000000 # Refill interval in microseconds (1 second)

            [Server.AllowedPathes.POST]
            "/chat.OnboardingService/RequestOnboarding" = ["^/chat\\.OnboardingService/RequestOnboarding$"]
            "/chat.OnboardingService/SubmitOnboarding" = ["^/chat\\.OnboardingService/SubmitOnboarding$"]

            [Server.ReverseRoutes."/"]
            upstreams = ["https://127.0.0.1:50052"]
            backend_type = "grpc_passthrough"

            [Server.RouterParams]
            protocol = "https"
            authentication = "None"
            ssl_root_certificate = "/Users/fredi/Data/Projekte/Rust/ios_test/260501_ChatApp/rust_core/certs/ca.pem"

            # V2 FIX: Zwingend erforderlich für Header-Sanitization auf dem Public Port!
            # Obwohl dieser Port kein mTLS nutzt, sagt dieser Block dem Proxy, 
            # welche Header gelöscht werden MÜSSEN, falls ein Hacker sie mitsendet.
            [Server.client_cert_forwarding]
            header_cert = "x-client-cert"
            header_san = "x-client-san"

